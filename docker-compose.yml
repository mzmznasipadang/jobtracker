services:
  web:
    build: .
    ports: ["127.0.0.1:3100:3000"]
    env_file: .env
    environment:
      DB_PATH: /data/jobtracker.db
      TZ: Asia/Jakarta
    volumes: ["./data:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  worker:
    build: .
    command: npm run worker
    env_file: .env
    environment:
      DB_PATH: /data/jobtracker.db
      TZ: Asia/Jakarta
    volumes: ["./data:/data"]
    restart: unless-stopped
